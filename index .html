<style>
:root{--bg:#f6f3ec;--card:#ffffff;--ink:#1f2a44;--acc:#c8553d;--teal:#2b7a78;--gray:#8a93a6;--line:#ddd6c8;--mut:#5a616a;--hint:#fbeee9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a2b;--card:#1d2540;--ink:#eee9dd;--acc:#f0866c;--teal:#52b5b0;--gray:#8d97ad;--line:#33406a;--mut:#aab2c5;--hint:#2b2a3c}}
:root[data-theme="dark"]{--bg:#141a2b;--card:#1d2540;--ink:#eee9dd;--acc:#f0866c;--teal:#52b5b0;--gray:#8d97ad;--line:#33406a;--mut:#aab2c5;--hint:#2b2a3c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 28px;color:var(--mut);font-size:16px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;padding:0 28px}
main.solo{grid-template-columns:1fr}
.col{display:flex;flex-direction:column;gap:14px;min-height:0;overflow:auto}
h1{font-size:clamp(36px,6vw,72px);margin:0 0 12px;line-height:1.05}
h2{font-size:clamp(24px,3vw,38px);margin:0 0 4px;line-height:1.15}
h3{font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 20px;font-size:clamp(17px,1.7vw,22px);line-height:1.4}
.card p{margin:0}
.en h3{color:var(--acc)}.qs{background:var(--ink);color:var(--bg)}.qs h3{color:var(--bg);opacity:.75}.hn h3{color:var(--teal)}
.hn ol{margin:0;padding-left:22px}.hn li{margin:0 0 8px}
.hn li[hidden]{display:none}
.qz{margin-top:10px;padding:12px 14px;border:1px dashed var(--teal);border-radius:10px;font-size:clamp(16px,1.5vw,20px)}.qz button{display:block;width:100%;text-align:left;margin-top:8px;font-size:inherit}#fb{margin-top:8px;color:var(--acc)}
.hn .none{color:var(--mut);font-style:italic}
button{font:inherit;font-size:16px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 16px;cursor:pointer}
button.p{background:var(--teal);color:#fff;border-color:var(--teal)}
input{font:inherit;font-size:18px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);flex:1;min-width:0}
button:disabled{opacity:.45;cursor:default}
.bar{display:flex;gap:10px;flex-wrap:wrap}
.stage{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.cw{position:relative;flex:1;min-height:260px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.cap{padding:10px 16px;border-top:1px solid var(--line);font-size:clamp(16px,1.5vw,20px);line-height:1.35;min-height:3.2em}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line);color:var(--mut);font-size:15px}
footer{display:flex;justify-content:space-between;align-items:center;padding:14px 28px}
.cover{justify-content:center;gap:12px}.cover p{font-size:clamp(20px,2.4vw,32px);margin:0;color:var(--mut)}
[hidden]{display:none!important}
.tabs{display:none}
@media (max-width:820px){body{overflow:hidden}main{grid-template-columns:1fr;overflow:auto;padding:0 14px}.col{overflow:visible}.tabs{display:flex;gap:8px;padding:0 14px 10px}.tabs button{flex:1}.tabs button.on{background:var(--ink);color:var(--bg)}main.tf .col{display:none}main:not(.tf) .stage{display:none}.stage{min-height:calc(100dvh - 250px)}button{min-height:44px}header{padding:10px 14px}footer{padding:8px 14px}#ttl{display:none}}
</style>

const SL=[{"cover": 1}, {"t": "Exercício 1", "lock": "g1"}, {"t": "Exercício 2", "lock": "g2"}, {"t": "Exercício 4", "lock": "g4"}, {"t": "Exercício 6a", "lock": "g6"}, {"t": "Exercício 6b", "lock": "g6"}];
async function dec(g,pw){const e=ENC[g],b=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0)),km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']),k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(e.s),iterations:e.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']),p=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(e.i)},k,b(e.c));return JSON.parse(new TextDecoder().decode(p))}
let cur=0,shown=[],stp=[],yaw=0,pit=0,zoom=1,auto=false,model=null,cv=null,ctx=null,W=0,H=0,drag=null;
SL.forEach((_,i)=>{shown[i]=0;stp[i]=0});
function vs(a,i){return(a&&a[i]!==undefined?a[i]:0)<=stp[cur]}
const main=document.getElementById('main');
function render(){
 const s=SL[cur];model=s.m?MODELS[s.m]:null;
 document.getElementById('cnt').textContent=(cur+1)+' / '+SL.length;
 document.getElementById('ttl').textContent=s.cover?'':s.t;
 document.getElementById('pv').disabled=cur===0;document.getElementById('nx').disabled=cur===SL.length-1;
 const tb=document.getElementById('tabs');tb.hidden=!!s.cover;
 if(s.lock){tb.hidden=true;main.className='solo';main.innerHTML='<div class="col cover"><h2>'+s.t+'</h2><div class="card"><h3>Exercício protegido</h3><p>Digite a senha do seu grupo para abrir.</p><div class="bar" style="margin-top:12px;flex-wrap:nowrap"><input id="pw" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="senha"><button class="p" id="ok">Abrir</button></div><p id="er" style="margin-top:8px;color:var(--acc)"></p></div></div>';cv=null;model=null;const pw=document.getElementById('pw'),er=document.getElementById('er'),op=async()=>{er.textContent='Verificando…';try{if(!window.crypto||!crypto.subtle){er.textContent='Este navegador bloqueou a criptografia. Abra o link por https.';return}const d=await dec(s.lock,pw.value.replace(/[\s-]/g,'').toLowerCase());Object.assign(MODELS,d.models);Object.keys(d.slides).forEach(k=>{Object.assign(SL[k],d.slides[k]);delete SL[k].lock});render()}catch(e){er.textContent='Senha incorreta.'}};document.getElementById('ok').onclick=op;pw.onkeydown=e=>{if(e.key==='Enter')op()};return}
 if(s.cover){main.className='solo';main.innerHTML='<div class="col cover"><p>Geometria Espacial · 2026.2</p><h1>Aula de Exercícios</h1><p>Lista 3 · Exercícios 1, 2, 4 e 6</p></div>';cv=null;return}
 main.className='';tb.innerHTML='<button class="on" id="t1">Exercício</button><button id="t2">Figura 3D</button>';
 document.getElementById('t1').onclick=()=>{main.classList.remove('tf');t1.classList.add('on');t2.classList.remove('on')};document.getElementById('t2').onclick=()=>{main.classList.add('tf');t2.classList.add('on');t1.classList.remove('on')};
 main.innerHTML='<div class="col"><h2>'+s.t+'</h2><div class="card en"><h3>Enunciado</h3><p>'+s.en+'</p></div><div class="card qs"><h3>Para a turma</h3><p>'+s.q+'</p></div><div class="card hn"><h3>Dicas</h3><ol id="hl">'+s.h.map((x,i)=>'<li hidden>'+x[0]+'</li>').join('')+'</ol><p class="none" id="nn">Responda a uma pergunta de teoria para liberar cada dica.</p><div class="qz" id="qz" hidden></div><div class="bar" style="margin-top:10px"><button class="p" id="hb"></button><button id="hh">Ocultar dicas</button></div></div></div><div class="stage"><div class="cw"><canvas id="cv"></canvas></div><div class="cap" id="cap"></div><div class="tools"><button id="sp">◀</button><button id="sn" class="p">Próximo passo ▶</button><button id="sa">Mostrar tudo</button><button id="rs">Reiniciar vista</button><button id="ar"></button><span>Arraste para girar · pinça ou role para ampliar</span></div></div>';
 const upd=()=>{const n=shown[cur],items=document.querySelectorAll('#hl li');items.forEach((li,i)=>li.hidden=i>=n);document.getElementById('nn').hidden=n>0;const b=document.getElementById('hb');b.textContent=n>=s.h.length?'Todas as dicas liberadas':'Responder para liberar a dica '+(n+1)+' de '+s.h.length;b.disabled=n>=s.h.length;document.getElementById('qz').hidden=true};
 document.getElementById('hb').onclick=()=>{const it=s.h[shown[cur]],z=document.getElementById('qz');z.hidden=false;z.innerHTML='<p><b>Pergunta de teoria:</b> '+it[1]+'</p>'+it[2].map((o,i)=>'<button data-i="'+i+'">'+o+'</button>').join('')+'<p id="fb"></p>';z.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{const i=+bt.dataset.i;if(i===it[3]){shown[cur]++;upd()}else{bt.disabled=true;bt.style.borderColor=css('--acc');document.getElementById('fb').innerHTML='Ainda não. Reveja o material: <b>'+it[4]+'</b>.'}})};document.getElementById('hh').onclick=()=>{shown[cur]=0;upd()};upd();
 const ar=document.getElementById('ar');const ut=()=>ar.textContent=auto?'Parar giro':'Girar sozinha';ut();ar.onclick=()=>{auto=!auto;ut()};
 const N=model.st.cap.length,us=()=>{const n=stp[cur];document.getElementById('cap').innerHTML='<b>Passo '+(n+1)+' de '+N+':</b> '+model.st.cap[n];document.getElementById('sp').disabled=n<=0;document.getElementById('sn').disabled=n>=N-1;document.getElementById('sa').disabled=n>=N-1};
 document.getElementById('sp').onclick=()=>{stp[cur]--;us()};document.getElementById('sn').onclick=()=>{stp[cur]++;us()};document.getElementById('sa').onclick=()=>{stp[cur]=N-1;us()};us();
 document.getElementById('rs').onclick=()=>{yaw=model.yaw;pit=model.pit;zoom=1};
 cv=document.getElementById('cv');ctx=cv.getContext('2d');yaw=model.yaw;pit=model.pit;zoom=1;
 const ptrs=new Map();let pd=0;
 cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,[e.clientX,e.clientY]);cv.setPointerCapture(e.pointerId);auto=false;ut();if(ptrs.size===2){const v=[...ptrs.values()];pd=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1])}});
 cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;const o=ptrs.get(e.pointerId);ptrs.set(e.pointerId,[e.clientX,e.clientY]);if(ptrs.size===2){const v=[...ptrs.values()],d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);if(pd)zoom=Math.max(.5,Math.min(3,zoom*d/pd));pd=d}else{yaw+=(e.clientX-o[0])*.01;pit=Math.max(-1.5,Math.min(1.5,pit+(e.clientY-o[1])*.01))}});
 const up=e=>{ptrs.delete(e.pointerId);pd=0};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
 cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.5,Math.min(3,zoom*Math.exp(-e.deltaY*.001)))},{passive:false});
}
function size(){if(!cv)return;const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;W=r.width;H=r.height;if(cv.width!==Math.round(W*d)){cv.width=Math.round(W*d);cv.height=Math.round(H*d)}ctx.setTransform(d,0,0,d,0,0)}
function pr(p){const c=model.c,x=p[0]-c[0],y=p[1]-c[1],z=p[2]-c[2],cy=Math.cos(yaw),sy=Math.sin(yaw),x1=x*cy-y*sy,y1=x*sy+y*cy,cp=Math.cos(pit),sp=Math.sin(pit),up=z*cp+y1*sp,dep=y1*cp-z*sp,S=Math.min(W,H)/(model.size*2)*zoom/(1+dep*.05);return[W/2+x1*S,H/2-up*S,dep]}
function R(k){return typeof k==='string'?model.pts[k]:k}
function draw(){
 requestAnimationFrame(draw);
 if(!cv||!model)return;size();if(auto)yaw+=.006;
 ctx.clearRect(0,0,W,H);
 const col=k=>css('--'+k);
 const polys=model.polys.map((g,i)=>{const pts=g[0].map(k=>pr(R(k)));return{pts,c:g[1],a:g[2],v:vs(model.st.p,i),d:pts.reduce((t,q)=>t+q[2],0)/pts.length}}).filter(g=>g.v).sort((p,q)=>q.d-p.d);
 polys.forEach(g=>{ctx.beginPath();g.pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();ctx.globalAlpha=g.a;ctx.fillStyle=col(g.c);ctx.fill();ctx.globalAlpha=.55;ctx.strokeStyle=col(g.c);ctx.lineWidth=1.5;ctx.stroke();ctx.globalAlpha=1});
 model.edges.forEach((e,i)=>{if(!vs(model.st.e,i))return;const p=pr(R(e[0])),q=pr(R(e[1]));ctx.beginPath();ctx.moveTo(p[0],p[1]);ctx.lineTo(q[0],q[1]);ctx.strokeStyle=col(e[2]);ctx.lineWidth=e[3];ctx.setLineDash(e[4]?[8,6]:[]);ctx.lineCap='round';ctx.stroke();ctx.setLineDash([])});
 const nz=v=>{const l=Math.hypot(v[0],v[1],v[2]);return[v[0]/l,v[1]/l,v[2]/l]};
 (model.ra||[]).forEach((g,i)=>{if(!vs(model.st.r,i))return;const v=R(g[0]),a=nz(g[1]),b=nz(g[2]),k=.2,pt=(i,j)=>pr([v[0]+a[0]*k*i+b[0]*k*j,v[1]+a[1]*k*i+b[1]*k*j,v[2]+a[2]*k*i+b[2]*k*j]),q=[pt(0,0),pt(1,0),pt(1,1),pt(0,1)];ctx.beginPath();q.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.globalAlpha=.25;ctx.fillStyle=col('acc');ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle=col('acc');ctx.lineWidth=2;ctx.stroke()});
 const fs=Math.max(22,Math.min(30,W/22));ctx.font='italic '+fs+'px Georgia, serif';ctx.textAlign='center';ctx.textBaseline='middle';
 Object.keys(model.pts).forEach(k=>{if((model.st.t[k]||0)>stp[cur])return;const p=pr(model.pts[k]);ctx.beginPath();ctx.arc(p[0],p[1],5,0,7);ctx.fillStyle=col('ink');ctx.fill()});
 model.labels.forEach((l,i)=>{if(!vs(model.st.l,i))return;const p=pr(R(l[0]));ctx.fillStyle=col(l[2]);ctx.fillText(l[1],p[0]+(typeof l[0]==='string'?14:0),p[1]-(typeof l[0]==='string'?14:0))});
}
function go(n){cur=Math.max(0,Math.min(SL.length-1,n));render();history.replaceState(null,'','#'+(cur+1))}
document.getElementById('pv').onclick=()=>go(cur-1);document.getElementById('nx').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')go(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')go(cur-1)});
const h0=parseInt(location.hash.slice(1));if(h0)cur=Math.max(0,Math.min(SL.length-1,h0-1));
render();draw();
